[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
build_flags = -Wall -Wextra -Werror -std=c11
check_tool = cppcheck
; PlatformIO analyseert per bestand: unusedFunction geeft dan onterechte meldingen.
; De overige style-, warning-, performance- en portabilitychecks blijven actief.
check_flags =
    cppcheck: --enable=warning,style,performance,portability
    cppcheck: --platform=avr8
    cppcheck: --inline-suppr

[env:native]
platform = native
test_framework = unity
test_build_src = yes
test_filter = test_core
build_src_filter = +<median_filter.c> +<theremin_math.c> +<button_debounce.c>
build_flags =
    -Wall
    -Wextra
    -Werror
    -std=c11
    -DMEDIAN_FILTER_TEST_ALLOCATOR
    -Itest/support

[env:native_display]
extends = env:native
test_filter = test_display
build_src_filter = +<lcd.c> +<display7.c>
